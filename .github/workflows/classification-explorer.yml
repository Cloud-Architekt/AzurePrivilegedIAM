name: Classification Explorer

on:
  push:
    paths:
      - 'Classification/**'
      - 'ClassificationExplorer/**'
      - 'EntraOps_Classification/**'
      - 'Modules/EntraOps.Classification/**'
      - 'Tests/**'
      - '.github/workflows/classification-explorer.yml'
  pull_request:
    paths:
      - 'Classification/**'
      - 'ClassificationExplorer/**'
      - 'EntraOps_Classification/**'
      - 'Modules/EntraOps.Classification/**'
      - 'Tests/**'
      - '.github/workflows/classification-explorer.yml'

permissions:
  contents: read

concurrency:
  group: classification-explorer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Install browser-test dependencies
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          $playwrightRoot = Join-Path $env:RUNNER_TEMP 'playwright'
          dotnet new console --output $playwrightRoot --framework net8.0
          dotnet add $playwrightRoot package Microsoft.Playwright --version 1.55.0
          dotnet build $playwrightRoot --configuration Release
          & (Join-Path $playwrightRoot 'bin/Release/net8.0/playwright.ps1') install --with-deps chromium
      - name: Validate and regenerate classification data
        shell: pwsh
        run: |
          Import-Module ./Modules/EntraOps.Classification -Force
          Update-EntraOpsClassificationExplorerData -Mode Standalone -StrictAttackPaths
      - name: Verify generated data is current
        run: >-
          git diff --exit-code
          --ignore-matching-lines='Auto-generated by Update-EntraOpsClassificationExplorerData'
          --ignore-matching-lines='"generatedUtc"'
          -- ClassificationExplorer/data-manifest.json
          ClassificationExplorer/data/classification-data.js
          ClassificationExplorer/data/attack-paths.js
          ClassificationExplorer/data/history-data.js
          ClassificationExplorer/data/notification-data.js
          ClassificationExplorer/data/tier-map.js
      - name: Run browser Tests
        shell: pwsh
        run: Invoke-Pester ./Tests/ClassificationExplorer.Tests.ps1 -CI -Output Detailed
